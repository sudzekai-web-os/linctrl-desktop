name: Выпуск релиза

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-24.04
          - rid: win-x64
            runner: windows-2022
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          install-deps: true
      - name: Собрать Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $build = Join-Path $env:RUNNER_TEMP 'linctrl-build'
          $package = New-Item -ItemType Directory -Path package/linctrl
          New-Item -ItemType Directory -Path archives | Out-Null
          cmake -S . -B $build -G 'Visual Studio 17 2022' -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build $build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath "$build/Release/applinctrl.exe" -Destination $package
          if (Test-Path -LiteralPath plugins) { Copy-Item -LiteralPath plugins -Destination $package -Recurse }
          windeployqt --release --qmldir qml --qmldir .github/qt-deploy "$package/applinctrl.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path -LiteralPath "$package/qml/QtQuick/Dialogs/qmldir")) { throw 'В пакет не вошёл QtQuick.Dialogs' }
          Compress-Archive -Path $package.FullName -DestinationPath "archives/linctrl-desktop-$env:TAG-win-x64.zip"
      - name: Установить patchelf
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf
      - name: Собрать Linux
        if: runner.os == 'Linux'
        env:
          RID: ${{ matrix.rid }}
          TAG: ${{ github.ref_name }}
        run: |
          cmake -S . -B "$RUNNER_TEMP/linctrl-build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/linctrl-build" --parallel
          package=package/linctrl
          mkdir -p "$package/lib" "$package/qt-plugins" archives
          install "$RUNNER_TEMP/linctrl-build/applinctrl" "$package/applinctrl"
          cp -a "$QT_ROOT_DIR/qml" "$package/"
          cp -a "$QT_ROOT_DIR/plugins/." "$package/qt-plugins/"
          cp -a "$QT_ROOT_DIR"/lib/libQt6*.so* "$package/lib/"
          for library in "$QT_ROOT_DIR"/lib/libicu*.so*; do
            if [[ -e "$library" ]]; then cp -a "$library" "$package/lib/"; fi
          done
          if [[ -d plugins ]]; then cp -a plugins "$package/"; fi
          cp .github/qt-deploy/qt.conf "$package/"
          install .github/qt-deploy/linctrl "$package/linctrl"
          test -f "$package/qml/QtQuick/Dialogs/qmldir"
          patchelf --force-rpath --set-rpath '$ORIGIN/lib' "$package/applinctrl"
          env -u LD_LIBRARY_PATH ldd "$package/applinctrl" | tee dependencies.txt
          if grep -q 'not found' dependencies.txt; then exit 1; fi
          grep -F "libQt6Qml.so.6 => $PWD/$package/lib/libQt6Qml.so.6" dependencies.txt
          status=0
          env -u LD_LIBRARY_PATH -u QT_PLUGIN_PATH -u QML_IMPORT_PATH -u QML2_IMPORT_PATH \
            QT_QPA_PLATFORM=offscreen XDG_DATA_HOME="$RUNNER_TEMP/linctrl-test" \
            timeout 5 "$package/applinctrl" || status=$?
          test "$status" -eq 124
          tar -czf "archives/linctrl-desktop-$TAG-$RID.tar.gz" -C package linctrl
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: archives/*
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Опубликовать релиз
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ ! "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes "${flags[@]}"
